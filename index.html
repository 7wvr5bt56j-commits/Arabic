<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arabic">
<meta name="theme-color" content="#F2F3F8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Arabic</title>
<style>
:root{--bg:#F2F3F8;--card:#FFFFFF;--sunk:#E7E9F2;--ink:#1A1C2B;--muted:#6A6E85;--line:#DADDEA;--accent:#4148E0;--accent2:#5B8CFF;--soft:#E3E6FF;--on:#FFFFFF;--ok:#1E9E62;--okbg:#DDF5E8;--bad:#D9473A;--badbg:#FBE2DF;--gold:#E3A008}
@media (prefers-color-scheme:dark){:root{--bg:#0E0F17;--card:#1A1C28;--sunk:#252838;--ink:#ECEDF5;--muted:#9A9DB4;--line:#30344A;--accent:#7C8CFF;--accent2:#5B8CFF;--soft:#262B52;--on:#0E0F17;--ok:#44CC88;--okbg:#173A29;--bad:#F07468;--badbg:#45211E;--gold:#F5C04A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
.app{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;min-height:100vh}
.bar{display:flex;align-items:center;gap:10px;min-height:40px}
.bar h2{margin:0;font-size:17px;flex:1;text-align:center}
.back{color:var(--accent);font-size:17px;padding:6px 0;min-width:70px;text-align:left}
.spacer{min-width:70px;text-align:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
h1{margin:4px 0 0;font-size:30px;letter-spacing:-.01em}
.small{font-size:14px;color:var(--muted)}
.box{background:var(--card);border-radius:18px;padding:16px}
.prog{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#fff}
.tile b{font-size:16px}
.tile span{font-size:13px;color:var(--muted)}
.lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 2px -4px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{color:var(--accent);display:block}
.star{font-size:22px;color:var(--line);padding:4px 6px;line-height:1}
.star.on{color:var(--gold)}
.btn{border-radius:14px;padding:15px;font-weight:700;width:100%;font-size:17px;background:var(--sunk)}
.btn.main{background:var(--accent);color:var(--on)}
.btn.okb{background:var(--okbg);color:var(--ok)} .btn.badb{background:var(--badbg);color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--sunk);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--ok)} .sw.on::after{left:23px}

/* Karteikarte */
.flash{perspective:1200px;height:340px;cursor:pointer;user-select:none;-webkit-user-select:none}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.fl .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border-radius:22px;box-shadow:0 6px 20px rgba(20,24,60,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.b{transform:rotateY(180deg)}
.face .star{position:absolute;top:10px;right:10px}
.face .hint{position:absolute;bottom:14px;font-size:13px;color:var(--muted)}
.big{font-size:30px;font-weight:700;white-space:pre-line;line-height:1.25}
.big.num{font-size:64px}
.ar{color:var(--accent)}
.laut{font-size:16px;color:var(--muted)}
.laut::before{content:"sprich ";font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.note{font-size:14px;background:var(--sunk);border-radius:10px;padding:8px 12px;max-width:34ch;text-align:left}
.note b{display:block;color:var(--gold);font-size:12px}
.cnt{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.cnt .l{color:var(--bad)} .cnt .r{color:var(--ok)}

/* Fragen */
.q{background:var(--card);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;min-height:150px;justify-content:center}
.q .ask{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-size:17px;white-space:pre-line}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.inp{width:100%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-size:18px;outline:none}
.inp:focus{border-color:var(--accent)}
.fb{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
.fb .h{font-weight:700} .fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)}
.link{color:var(--accent);font-size:15px;padding:6px 0}

/* Spiele */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{background:var(--card);border-radius:14px;min-height:88px;padding:8px;font-size:15px;font-weight:600;display:grid;place-items:center;text-align:center;transition:opacity .25s,transform .25s,background .15s;word-break:break-word}
.mt.sel{background:var(--soft);outline:2px solid var(--accent)}
.mt.gone{opacity:0;transform:scale(.8);pointer-events:none}
.mt.err{background:var(--badbg);animation:shake .3s}
.mt.hid{background:linear-gradient(160deg,var(--accent2),var(--accent));color:transparent}
.mt.hid::after{content:"؟";color:rgba(255,255,255,.85);font-size:26px}
.mt.match{background:var(--okbg)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.timer{font-size:28px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 16px}
.res .em{font-size:52px;line-height:1}
.res h2{margin:0;font-size:26px}
.say{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:20px;flex:none}
.arab{font-size:24px;direction:rtl;font-family:"Geeza Pro","Noto Naskh Arabic","Arial",sans-serif}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:9}
</style>
</head><body>

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const isNum = w => /^\d+$/.test(w.de);
const BYID = {}; WORDS.forEach(w => BYID[w.id] = w);
const byIds = ids => ids.map(id => BYID[id]).filter(Boolean);
const CATS = [["all","Alle"],["words","Wörter"],["nums","Zahlen"],["zeit","Zeit"],["star","★"]];
const inCat = w => S.cat === "words" ? !isNum(w) && w.c !== "zeit" : S.cat === "nums" ? isNum(w) : S.cat === "zeit" ? w.c === "zeit" : S.cat === "star" ? !!S.star[w.id] : true;
const pool = () => { const p = WORDS.filter(inCat); return p.length ? p : WORDS; };
const gamePool = () => { const p = pool().filter(w => !w.g); return p.length >= 6 ? p : WORDS.filter(w => !w.g); };
const catName = () => S.cat === "star" ? "Markiert" : CATS.find(c => c[0] === S.cat)[1];
const dir = () => S.front === "mix" ? (Math.random() < .5 ? "de" : "dar") : S.front;
const promptOf = (w, d) => d === "de" ? w.de : w.dar;
const answerOf = (w, d) => d === "de" ? w.dar : w.de;
function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1800); }
function fmtTime(ms){ return (ms/1000).toFixed(1).replace(".", ",") + " s"; }
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)/g,"").replace(/[…?!.,'"„“-]/g,"").replace(/\s+/g," ").trim(); }

// falsche Antworten für Multiple Choice: gleiche Art (Zahl oder Wort)
function distractors(w, d, k){
  const same = WORDS.filter(x => x.id !== w.id && !x.g && isNum(x) === isNum(w) && answerOf(x,d) !== answerOf(w,d));
  const other = WORDS.filter(x => x.id !== w.id && !x.g && !same.includes(x));
  return shuffle(same).concat(shuffle(other)).slice(0, k);
}
function answerBlock(w){
  return `<div style="display:flex;align-items:center;gap:12px"><div style="flex:1"><div class="big ar" style="font-size:24px">${esc(w.dar)}</div>${w.ar ? `<div class="arab">${esc(w.ar)}</div>` : ""}</div>${sayBtn(w)}</div>${w.laut ? `<div class="laut">${esc(w.laut)}</div>` : ""}<div>${esc(w.de)}</div>${note(w)}`;
}
function note(w){ return (w.o || w.n) ? `<div class="note">${w.o ? `<b>Deine Notiz: ${esc(w.o)}</b>` : ""}${esc(w.n || "")}</div>` : ""; }
function bar(title, right){
  return `<div class="bar"><button class="back" id="back">‹ Zurück</button><h2>${esc(title)}</h2><div class="spacer" id="right">${right || ""}</div></div>`;
}
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function go(fn){ clearTimers(); window.scrollTo(0,0); fn(); }
function wireBack(){ const b = $("back"); if (b) b.onclick = () => go(home); }
/* ---------- Aussprache: arabische Stimme des Geräts liest die arabische Schrift vor ---------- */
let VOICE = null;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICE = vs.find(v => /^ar[-_]MA/i.test(v.lang)) || vs.find(v => /^ar/i.test(v.lang)) || null;
}
if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(id){
  const w = BYID[id]; if (!w || !w.ar) return;
  if (!window.speechSynthesis){ toast("Vorlesen wird hier nicht unterstützt"); return; }
  if (!VOICE) pickVoice();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(w.ar.replace(/\//g, "، "));
  u.lang = VOICE ? VOICE.lang : "ar-SA"; if (VOICE) u.voice = VOICE; u.rate = .8;
  if (!VOICE) toast("Keine arabische Stimme gefunden. iPhone: Einstellungen › Bedienungshilfen › Gesprochene Inhalte › Stimmen › Arabisch");
  speechSynthesis.speak(u);
}
const sayBtn = w => w.ar ? `<button class="say" data-say="${w.id}" aria-label="Vorlesen">🔊</button>` : "";
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b){ e.stopPropagation(); e.preventDefault(); say(+b.dataset.say); } }, true);

function setSess(x){ S.sess = x; save(); }
function endSess(){ S.sess = null; save(); }

/* ---------- Start ---------- */
function home(){
  const list = pool(), total = list.length, mastered = list.filter(w => S.lv[w.id] === 2).length, stars = Object.keys(S.star).length;
  const tile = (id, ic, col, name, sub) => `<button class="tile" id="${id}"><div class="ic" style="background:${col}">${ic}</div><b>${name}</b><span>${sub}</span></button>`;

  $("app").innerHTML = `
    <div><h1>Arabic</h1><div class="small">${catName()}: ${total} Begriffe · ${mastered} beherrscht · ${list.filter(w => S.known[w.id]).length} in Karteikarten gewusst</div></div>
    <div class="prog"><i style="width:${mastered/total*100}%"></i></div>
    ${resume}
    <div class="seg">${CATS.map(([k,n]) => `<button data-c="${k}" class="${S.cat===k?"on":""}">${n}</button>`).join("")}</div>
    <div class="lbl">Lernen</div>
    <div class="grid">
      ${tile("m-fc","▤","#4148E0","Karteikarten","Umdrehen und sortieren")}
      ${tile("m-learn","✦","#7B4FE0","Lernen","Erkennen, dann sprechen")}
      ${tile("m-test","✓","#1E9E62","Test","12 gemischte Fragen")}
      ${tile("g-match","⇄","#E8590C","Zuordnen", S.best.match ? "Bestzeit " + fmtTime(S.best.match) : "Paare gegen die Zeit")}
      ${tile("g-blitz","⚡","#D6336C","Blitzrunde", S.best.blitz ? "Rekord " + S.best.blitz + " Punkte" : "60 s richtig oder falsch")}
      ${tile("g-mem","◫","#3B5BDB","Memory", S.best.mem ? "Rekord " + S.best.mem + " Züge" : "Paare aufdecken")}
    </div>
    <div class="lbl">Abfragerichtung</div>
    <div class="seg">${[["de","Deutsch → Arabic"],["dar","Arabic → Deutsch"],["mix","Gemischt"]].map(([k,n]) => `<button data-f="${k}" class="${S.front===k?"on":""}">${n}</button>`).join("")}</div>
    <div class="lbl">Begriffe (${total})</div>
    <div class="box" style="padding-top:4px;padding-bottom:4px">${list.map(w => `<div class="row"><div class="t">${esc(w.de)}<b>${esc(w.dar).replace(/\n/g," · ")}</b>${w.laut ? `<span class="small">${esc(w.laut)}</span>` : ""}${w.o ? `<div class="small">Deine Notiz: ${esc(w.o)}</div>` : ""}</div>${sayBtn(w)}<button class="star ${S.star[w.id]?"on":""}" data-s="${w.id}" aria-label="Markieren">★</button></div>`).join("")}</div>
    <div class="lbl">Lernstand übertragen</div>
    <div class="box" style="display:flex;flex-direction:column;gap:10px">
      <div class="small">Jede App auf dem Homescreen hat ihren eigenen Speicher. Zum Umziehen in der alten App „Code kopieren“ tippen und in der neuen App „Code einfügen“.</div>
      <div class="two"><button class="btn" id="exp">Code kopieren</button><button class="btn" id="imp">Code einfügen</button></div>
      <div id="xfer"></div>
    </div>
    <button class="link" id="reset" style="color:var(--bad)">Lernfortschritt zurücksetzen</button>`;
  $("exp").onclick = exportCode;
  $("imp").onclick = importForm;
  if ($("resume")) $("resume").onclick = () => go(resumeSess);
  $("m-fc").onclick = () => go(() => S.sess && S.sess.m === "fc" ? resumeSess() : flashStart());
  $("m-learn").onclick = () => go(() => S.sess && S.sess.m === "learn" ? resumeSess() : learnStart());
  $("m-test").onclick = () => go(() => S.sess && S.sess.m === "test" ? resumeSess() : testStart());
  $("g-match").onclick = () => go(matchStart);
  $("g-blitz").onclick = () => go(blitzStart);
  $("g-mem").onclick = () => go(memStart);
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    if (b.dataset.c === "star" && !stars){ toast("Markiere zuerst Begriffe mit ★"); return; }
    if (S.cat !== b.dataset.c){ S.cat = b.dataset.c; S.sess = null; save(); }
    home();
  });
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { S.front = b.dataset.f; save(); home(); });
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { const id = b.dataset.s; if (S.star[id]) delete S.star[id]; else S.star[id] = true; save(); b.classList.toggle("on"); });
  $("reset").onclick = () => { if (confirm("Lernfortschritt und Rekorde löschen? Markierungen bleiben.")){ S.lv = {}; S.best = {}; S.sess = null; save(); home(); } };
}
/* ---------- Lernstand übertragen (zwischen Homescreen-Apps) ---------- */
function stateCounts(d){ return {lv: Object.keys(d.lv||{}).length, known: Object.keys(d.known||{}).length, star: Object.keys(d.star||{}).length, sess: d.sess ? 1 : 0}; }
function exportCode(){
  const data = {v:2, lv:S.lv, known:S.known, star:S.star, best:S.best, sess:S.sess};
  const code = "ARABIC1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const c = stateCounts(data), empty = !c.lv && !c.known && !c.star && !c.sess;
  $("xfer").innerHTML = `<textarea class="inp" id="xc" rows="3" readonly style="font-size:12px">${esc(code)}</textarea>
    <div class="small">${empty ? "<b style='color:var(--bad)'>Achtung: In dieser App ist kein Lernstand gespeichert. Der Code ist leer.</b>" :
      `Im Code: ${c.lv} Begriffe aus Lernen, ${c.known} aus Karteikarten, ${c.star} Markierungen${c.sess ? ", eine laufende Runde" : ""}.`}</div>`;
  const done = () => toast(empty ? "Code kopiert, aber er ist leer" : "Code kopiert. Jetzt in der neuen App einfügen.");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, () => { $("xc").select(); toast("Code markiert, bitte kopieren"); });
  else { $("xc").select(); toast("Code markiert, bitte kopieren"); }
}
function importForm(){
  $("xfer").innerHTML = `<textarea class="inp" id="xi" rows="3" placeholder="Code hier einfügen" style="font-size:12px" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea><button class="btn main" id="xgo">Übernehmen</button><div class="small" id="xmsg"></div>`;
  $("xgo").onclick = () => importCode($("xi").value);
}
// Code lesen: findet „ARABIC1:“ auch mitten im Text, ignoriert Leerzeichen und Zeilenumbrüche
function parseCode(raw){
  const s = String(raw || ""), i = s.indexOf("ARABIC1:");
  if (i < 0) throw new Error("Im eingefügten Text steht kein „ARABIC1:“.");
  let b = s.slice(i + 8).replace(/[^A-Za-z0-9+/=_-]/g, "").replace(/-/g, "+").replace(/_/g, "/");
  b = b.replace(/=+$/, ""); while (b.length % 4) b += "=";
  try { return JSON.parse(decodeURIComponent(escape(atob(b)))); }
  catch(e){ throw new Error("Der Code ist unvollständig. Bitte noch einmal ganz kopieren."); }
}
// Zusammenführen: pro Begriff gilt der bessere Stand, nichts geht verloren
function importCode(raw){
  const msg = t => { const el = $("xmsg"); if (el) el.textContent = t; toast(t); };
  let d;
  try { d = parseCode(raw); } catch(e){ return msg(e.message); }
  const c = stateCounts(d);
  if (!c.lv && !c.known && !c.star && !c.sess) return msg("Der Code ist gültig, aber leer: In der App, aus der er stammt, war kein Lernstand gespeichert.");
  let n = 0;
  for (const [id, lv] of Object.entries(d.lv || {})){ if (BYID[id] && (S.lv[id] || 0) < lv){ S.lv[id] = lv; n++; } }
  for (const id of Object.keys(d.known || {})){ if (BYID[id] && !S.known[id]){ S.known[id] = 1; n++; } }
  Object.keys(d.star || {}).forEach(id => { if (BYID[id]) S.star[id] = true; });
  const b = d.best || {};
  if (b.match && (!S.best.match || b.match < S.best.match)) S.best.match = b.match;
  if (b.mem && (!S.best.mem || b.mem < S.best.mem)) S.best.mem = b.mem;
  if (b.blitz && b.blitz > (S.best.blitz || 0)) S.best.blitz = b.blitz;
  if (d.sess && d.sess.m === "fc") (d.sess.know || []).forEach(id => { if (BYID[id] && !S.known[id]){ S.known[id] = 1; n++; } });
  if (d.sess && !S.sess) S.sess = d.sess;
  save();
  toast(`Übernommen: ${n} Begriffe${d.sess ? " und die laufende Runde" : ""}`);
  home();
}

function resumeSess(){
  const s = S.sess; if (!s) return home();
  if (s.m === "fc"){ F = {list: byIds(s.ids), i: s.i, know: byIds(s.know), learn: byIds(s.learn), hist: s.hist, flipped:false}; return flash(); }
  if (s.m === "learn"){ L = {list: pool(), round: byIds(s.round), i: s.i, right: s.right}; return learnQ(); }
  if (s.m === "test"){ T = {qs: s.qs.map(q => ({w: BYID[q.id], type: q.type, d: q.d})).filter(q => q.w), i: s.i, right: s.right, wrong: byIds(s.wrong)}; return testQ(); }
  home();
}

/* ---------- Karteikarten ---------- */
let F;
function flashSave(){ setSess({m:"fc", catName: catName(), ids: F.list.map(w => w.id), i: F.i, know: F.know.map(w => w.id), learn: F.learn.map(w => w.id), hist: F.hist}); }
function flashStart(cards){
  const list = cards || (S.shuf ? shuffle(pool()) : pool());
  F = {list, i:0, know:[], learn:[], flipped:false, hist:[]};
  flashSave(); flash();
}
function flash(){
  if (F.i >= F.list.length) return flashEnd();
  const w = F.list[F.i], d = F.d || (F.d = dir());
  const arSide = `<div class="big ar">${esc(w.dar)}</div>${w.ar ? `<div class="arab">${esc(w.ar)}</div>` : ""}${w.laut ? `<div class="laut">${esc(w.laut)}</div>` : ""}${sayBtn(w)}`;
  const front = d === "de" ? `<div class="big${isNum(w)?" num":""}">${esc(w.de)}</div>` : arSide;
  const back = d === "de" ? arSide + note(w) : `<div class="big${isNum(w)?" num":""}">${esc(w.de)}</div>${note(w)}`;
  const st = `<button class="star ${S.star[w.id]?"on":""}" data-st>★</button>`;
  $("app").innerHTML = `${bar("Karteikarten", (F.i+1) + " / " + F.list.length)}
    <div class="prog"><i style="width:${F.i/F.list.length*100}%"></i></div>
    <div class="cnt"><span class="l">${F.learn.length} noch lernen</span><span class="r">${F.know.length} gewusst</span></div>
    <div class="flash${F.flipped?" fl":""}" id="card"><div class="in"><div class="face">${st}${front}<div class="hint">Laut sagen, dann tippen zum Umdrehen</div></div><div class="face b">${st}${back}</div></div></div>
    <div class="two"><button class="btn badb" id="no">✗ Noch lernen</button><button class="btn okb" id="yes">✓ Gewusst</button></div>
    <div style="display:flex;justify-content:space-between"><button class="link" id="undo" ${F.hist.length?"":"disabled style='opacity:.4'"}>↶ Zurück</button><button class="link" id="shuf">${S.shuf ? "Gemischt ✓" : "Mischen"}</button><button class="link" id="new">Neu starten</button></div>`;
  wireBack();
  $("card").onclick = e => { if (e.target.closest("[data-st]")) return; F.flipped = !F.flipped; $("card").classList.toggle("fl"); };
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = e => { e.stopPropagation(); if (S.star[w.id]) delete S.star[w.id]; else S.star[w.id] = true; save(); document.querySelectorAll("[data-st]").forEach(x => x.classList.toggle("on", !!S.star[w.id])); });
  const mark = ok => { if (ok) S.known[w.id] = 1; else delete S.known[w.id]; F.hist.push(ok); (ok ? F.know : F.learn).push(w); F.i++; F.flipped = false; F.d = null; flashSave(); flash(); };
  $("yes").onclick = () => mark(true);
  $("no").onclick = () => mark(false);
  $("undo").onclick = () => { if (!F.hist.length) return; const ok = F.hist.pop(); (ok ? F.know : F.learn).pop(); F.i--; F.flipped = false; F.d = null; flashSave(); flash(); };
  $("shuf").onclick = () => { S.shuf = !S.shuf; save(); flashStart(); };
  $("new").onclick = () => flashStart();
}
function flashEnd(){
  endSess();
  const l = F.learn;
  $("app").innerHTML = `${bar("Karteikarten")}
    <div class="box res"><div class="em">${l.length ? "💪" : "🎉"}</div><h2>${l.length ? "Gut gemacht!" : "Alles gewusst!"}</h2>
    <p class="small">${F.know.length} gewusst, ${l.length} noch lernen.</p>
    ${l.length ? `<button class="btn main" id="again">Die ${l.length} nochmal üben</button>` : ""}
    <button class="btn" id="restart">Alle Karten neu starten</button></div>`;
  wireBack();
  if (l.length) $("again").onclick = () => flashStart(shuffle(l));
  $("restart").onclick = () => flashStart();
}

/* ---------- Gemeinsame Fragen ---------- */
function askMC(w, d, host, cb){
  const opts = shuffle([w].concat(distractors(w, d, 3)));
  host.innerHTML = `<div class="q"><div class="ask">${d === "de" ? "Was heißt das auf Arabic?" : "Was heißt das auf Deutsch?"}</div><div class="big${d==="de"?"":" ar"}${isNum(w)&&d==="de"?" num":""}">${esc(promptOf(w,d))}</div></div>
    <div class="opts">${opts.map(o => `<button class="opt" data-id="${o.id}">${esc(answerOf(o,d))}</button>`).join("")}</div><div id="fb"></div>`;
  host.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = +b.dataset.id === w.id;
    host.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.id === w.id) x.classList.add("ok"); });
    if (!ok) b.classList.add("bad");
    cb(ok);
  });
}
// Sprechen: deutsches Wort sehen, laut auf Arabic sagen, aufdecken, selbst bewerten
function askSpeak(w, host, cb){
  host.innerHTML = `<div class="q"><div class="ask">Sag es laut auf Arabic</div><div class="big${isNum(w)?" num":""}">${esc(w.de)}</div></div>
    <button class="btn main" id="rv">Aufdecken</button><div id="fb"></div>`;
  host.querySelector("#rv").onclick = () => {
    host.querySelector("#rv").remove();
    $("fb").innerHTML = `<div class="fb" style="background:var(--card)">${answerBlock(w)}</div>
      <div class="two" style="margin-top:10px"><button class="btn badb" id="sn">✗ Nicht gewusst</button><button class="btn okb" id="sy">✓ Richtig gesagt</button></div>`;
    $("sn").onclick = () => cb(false);
    $("sy").onclick = () => cb(true);
  };
}
// Rückmeldung immer mit Arabic, Lautschrift und Hinweis, auch bei richtiger Antwort
function feedback(w, ok, onNext){
  const fb = $("fb");
  fb.innerHTML = `<div class="fb ${ok?"ok":"bad"}"><div class="h">${ok ? "Richtig!" : "Nicht ganz"}</div>${answerBlock(w)}</div>
    <button class="btn main" id="nx" style="margin-top:10px">Weiter</button>`;
  $("nx").onclick = onNext;
  fb.scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* ---------- Lernen: Stufe 1 erkennen (Auswahl), Stufe 2 sprechen, dann beherrscht ---------- */
let L;
function learnSave(){ setSess({m:"learn", catName: catName(), round: L.round.map(w => w.id), i: L.i, right: L.right}); }
function learnStart(){
  const list = pool();
  if (list.every(w => S.lv[w.id] === 2)) return learnDone(list);
  const open = list.filter(w => S.lv[w.id] !== 2).sort((a,b) => (S.lv[a.id]||0) - (S.lv[b.id]||0));
  L = {list, round: open.slice(0,7), i:0, right:0};
  learnSave(); learnQ();
}
function learnQ(){
  if (L.i >= L.round.length) return learnRound();
  const w = L.round[L.i], lv = S.lv[w.id] || 0, d = w.g ? "de" : dir();
  const m = L.list.filter(x => S.lv[x.id] === 2).length;
  $("app").innerHTML = `${bar("Lernen", m + " / " + L.list.length)}<div class="prog"><i style="width:${m/L.list.length*100}%"></i></div>
    <div class="small">${lv === 0 ? "Stufe 1 von 2: erkennen" : "Stufe 2 von 2: sprechen"}</div><div id="qa" style="display:flex;flex-direction:column;gap:12px"></div>`;
  wireBack();
  const host = $("qa");
  const next = () => { L.i++; learnSave(); learnQ(); };
  const setLv = ok => { S.lv[w.id] = ok ? Math.min(2, lv + 1) : 0; if (ok) L.right++; L.i++; learnSave(); L.i--; };
  if (lv === 0) askMC(w, d, host, ok => { setLv(ok); feedback(w, ok, next); });
  else askSpeak(w, host, ok => { setLv(ok); next(); });
}
function learnRound(){
  endSess();
  const m = L.list.filter(x => S.lv[x.id] === 2).length;
  if (m === L.list.length) return learnDone(L.list);
  $("app").innerHTML = `${bar("Lernen")}<div class="box res"><div class="em">🔥</div><h2>Runde geschafft</h2><p class="small">${L.right} von ${L.round.length} richtig. Beherrscht: ${m} von ${L.list.length}.</p><div class="prog" style="width:100%"><i style="width:${m/L.list.length*100}%"></i></div><button class="btn main" id="cont">Weiter lernen</button></div>`;
  wireBack(); $("cont").onclick = learnStart;
}
function learnDone(list){
  endSess();
  $("app").innerHTML = `${bar("Lernen")}<div class="box res"><div class="em">🏆</div><h2>Alles beherrscht!</h2><p class="small">Du kannst alle ${list.length} Begriffe aus „${catName()}“. Für Wiederholung: Test oder Spiele.</p><button class="btn" id="re">Lernen neu starten</button></div>`;
  wireBack(); $("re").onclick = () => { list.forEach(w => delete S.lv[w.id]); save(); learnStart(); };
}

/* ---------- Test: 12 gemischte Fragen (Auswahl und richtig/falsch) ---------- */
let T;
function testSave(){ setSess({m:"test", catName: catName(), qs: T.qs.map(q => ({id: q.w.id, type: q.type, d: q.d})), i: T.i, right: T.right, wrong: T.wrong.map(w => w.id)}); }
function testStart(){
  const list = shuffle(gamePool()).slice(0, 12);
  T = {qs: shuffle(list.map((w, i) => ({w, type: i % 2 ? "tf" : "mc", d: dir()}))), i:0, right:0, wrong:[]};
  testSave(); testQ();
}
function testQ(){
  if (T.i >= T.qs.length) return testEnd();
  const {w, type, d} = T.qs[T.i];
  $("app").innerHTML = `${bar("Test", (T.i+1) + " / " + T.qs.length)}<div class="prog"><i style="width:${T.i/T.qs.length*100}%"></i></div><div id="qa" style="display:flex;flex-direction:column;gap:12px"></div>`;
  wireBack();
  const host = $("qa"), next = () => testQ();
  const res = ok => { if (ok) T.right++; else T.wrong.push(w); T.i++; testSave(); feedback(w, ok, next); };
  if (type === "mc") askMC(w, d, host, res);
  else {
    const real = Math.random() < .5, shown = real ? w : distractors(w, d, 1)[0];
    host.innerHTML = `<div class="q"><div class="ask">Richtig oder falsch?</div><div class="big${d==="de"?"":" ar"}">${esc(promptOf(w,d))}</div><div class="small">bedeutet</div><div class="big${d==="de"?" ar":""}" style="font-size:24px">${esc(answerOf(shown,d))}</div></div>
      <div class="two"><button class="btn badb" data-a="0">Falsch</button><button class="btn okb" data-a="1">Richtig</button></div><div id="fb"></div>`;
    host.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { host.querySelectorAll("[data-a]").forEach(x => x.disabled = true); res((b.dataset.a === "1") === real); });
  }
}
function testEnd(){
  endSess();
  const n = T.qs.length, p = Math.round(T.right/n*100);
  $("app").innerHTML = `${bar("Test")}<div class="box res"><div class="em">${p >= 90 ? "🏆" : p >= 60 ? "👍" : "📚"}</div><h2>${p} %</h2><p class="small">${T.right} von ${n} richtig</p>
    ${T.wrong.length ? `<div style="width:100%;text-align:left">${T.wrong.map(w => `<div class="row"><div class="t">${esc(w.de)}<b>${esc(w.dar)}</b>${w.laut ? `<span class="small">${esc(w.laut)}</span>` : ""}</div></div>`).join("")}</div>` : ""}
    <button class="btn main" id="re">Neuer Test</button></div>`;
  wireBack(); $("re").onclick = testStart;
}

/* ---------- Spiel: Zuordnen ---------- */
function matchStart(){
  const ws = pickPairs();
  const tiles = shuffle(ws.flatMap(w => [{id:w.id, t:w.de}, {id:w.id, t:w.dar}]));
  let sel = null, left = 6, pen = 0; const t0 = Date.now();
  $("app").innerHTML = `${bar("Zuordnen")}<div class="timer" id="tm">0,0 s</div><div class="small" style="text-align:center">Tippe zwei Kacheln, die zusammengehören. Fehler kosten 1 Sekunde.</div>
    <div class="mgrid">${tiles.map((x,i) => `<button class="mt" data-i="${i}">${esc(x.t)}</button>`).join("")}</div>`;
  wireBack();
  timers.push(setInterval(() => { const el = $("tm"); if (el) el.textContent = fmtTime(Date.now() - t0 + pen); }, 100));
  document.querySelectorAll(".mt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (sel === null){ sel = i; b.classList.add("sel"); return; }
    if (sel === i){ b.classList.remove("sel"); sel = null; return; }
    const a = document.querySelector(`.mt[data-i="${sel}"]`);
    if (tiles[sel].id === tiles[i].id){
      a.classList.remove("sel"); a.classList.add("gone"); b.classList.add("gone"); left--;
      if (!left){ clearTimers(); const ms = Date.now() - t0 + pen; const rec = !S.best.match || ms < S.best.match; if (rec){ S.best.match = ms; save(); }
        setTimeout(() => gameEnd("Zuordnen", "⏱️", fmtTime(ms), rec ? "Neue Bestzeit!" : "Bestzeit: " + fmtTime(S.best.match), matchStart), 300); }
    } else {
      pen += 1000; a.classList.remove("sel"); [a,b].forEach(x => { x.classList.add("err"); setTimeout(() => x.classList.remove("err"), 350); });
    }
    sel = null;
  });
}

/* ---------- Spiel: Blitzrunde ---------- */
function blitzStart(){
  let score = 0, streak = 0, left = 60, cur;
  const ws = gamePool();
  $("app").innerHTML = `${bar("Blitzrunde")}<div class="two" style="align-items:center"><div class="timer" id="tl">60</div><div class="timer" id="sc" style="color:var(--accent)">0</div></div>
    <div class="small" style="text-align:center">Sekunden · Punkte</div>
    <div class="q" id="bq"></div>
    <div class="two"><button class="btn badb" id="bf">✗ Falsch</button><button class="btn okb" id="bt">✓ Richtig</button></div>
    <div class="small" id="bs" style="text-align:center">&nbsp;</div>`;
  wireBack();
  const nextQ = () => {
    const w = ws[Math.floor(Math.random()*ws.length)], d = dir(), real = Math.random() < .5;
    cur = {real}; const shown = real ? w : distractors(w, d, 1)[0];
    $("bq").innerHTML = `<div class="big${d==="de"?"":" ar"}" style="font-size:26px">${esc(promptOf(w,d))}</div><div class="small">bedeutet</div><div class="big${d==="de"?" ar":""}" style="font-size:24px">${esc(answerOf(shown,d))}</div>`;
  };
  const ans = yes => {
    if (!left) return;
    if (yes === cur.real){ streak++; score += streak >= 5 ? 2 : 1; $("bs").textContent = streak >= 5 ? `🔥 Serie ${streak}: doppelte Punkte` : "Richtig"; }
    else { streak = 0; $("bs").textContent = "Falsch, Serie weg"; }
    $("sc").textContent = score; nextQ();
  };
  $("bt").onclick = () => ans(true); $("bf").onclick = () => ans(false);
  nextQ();
  timers.push(setInterval(() => {
    left--; const el = $("tl"); if (el) el.textContent = left;
    if (left <= 0){ clearTimers(); const rec = score > (S.best.blitz || 0); if (rec){ S.best.blitz = score; save(); }
      gameEnd("Blitzrunde", "⚡", score + " Punkte", rec ? "Neuer Rekord!" : "Rekord: " + S.best.blitz + " Punkte", blitzStart); }
  }, 1000));
}

/* ---------- Spiel: Memory ---------- */
function memStart(){
  const ws = pickPairs();
  const tiles = shuffle(ws.flatMap(w => [{id:w.id, t:w.de}, {id:w.id, t:w.dar}]));
  let open = [], moves = 0, found = 0, lock = false;
  $("app").innerHTML = `${bar("Memory", "0 Züge")}<div class="small" style="text-align:center">Finde die Paare aus Deutsch und Arabic.</div>
    <div class="mgrid">${tiles.map((x,i) => `<button class="mt hid" data-i="${i}">${esc(x.t)}</button>`).join("")}</div>`;
  wireBack();
  document.querySelectorAll(".mt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (lock || !b.classList.contains("hid")) return;
    b.classList.remove("hid"); open.push(i);
    if (open.length < 2) return;
    moves++; $("right").textContent = moves + " Züge";
    const [x, y] = open; open = [];
    const bx = document.querySelector(`.mt[data-i="${x}"]`), by = b;
    if (tiles[x].id === tiles[y].id){
      bx.classList.add("match"); by.classList.add("match"); found++;
      if (found === 6){ const rec = !S.best.mem || moves < S.best.mem; if (rec){ S.best.mem = moves; save(); }
        setTimeout(() => gameEnd("Memory", "🧠", moves + " Züge", rec ? "Neuer Rekord!" : "Rekord: " + S.best.mem + " Züge", memStart), 500); }
    } else { lock = true; setTimeout(() => { bx.classList.add("hid"); by.classList.add("hid"); lock = false; }, 900); }
  });
}

// 6 Paare ohne doppelte Texte (z. B. „sac“ für Tasche und Rucksack), sonst wären Paare nicht eindeutig
function pickPairs(){
  const seen = new Set(), out = [];
  for (const w of shuffle(gamePool())){
    const a = norm(w.de), b = norm(w.dar);
    if (seen.has(a) || seen.has(b)) continue;
    seen.add(a); seen.add(b); out.push(w);
    if (out.length === 6) break;
  }
  return out;
}
function gameEnd(title, em, big, sub, again){
  $("app").innerHTML = `${bar(title)}<div class="box res"><div class="em">${em}</div><h2>${big}</h2><p class="small">${sub}</p><button class="btn main" id="ag">Nochmal spielen</button><button class="btn" id="hm">Zur Übersicht</button></div>`;
  wireBack(); $("ag").onclick = () => go(again); $("hm").onclick = () => go(home);
}

// Beim Öffnen direkt dort weitermachen, wo du aufgehört hast
if (S.sess) resumeSess(); else home();
// offline nutzbar: speichert die App nach dem ersten Öffnen auf dem Gerät
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js", {scope:"./"}).catch(()=>{});
</script>
